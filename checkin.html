<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Check-In Scanner — SIC 2027 (staff)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000000'/%3E%3Cpath d='M8 44 56 32' stroke='%23FCA311' stroke-width='6'/%3E%3Ctext x='32' y='28' font-family='Arial Black,sans-serif' font-size='20' font-style='italic' font-weight='900' fill='%23FFFFFF' text-anchor='middle'%3ESIC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<style>
  body { max-width: 30rem; margin: 0 auto; padding: 1.5rem; }
  h1 { font-family: var(--display); font-size: 1.8rem; margin: 0.5rem 0 1rem; }
  #reader { border-radius: 14px; overflow: clip; border: 1px solid rgb(66 94 123 / 0.5); }
  .fld input { width: 100%; padding: 0.85rem 1rem; background: rgb(20 33 61 / 0.5); border: 1px solid rgb(66 94 123 / 0.5); border-radius: 10px; color: var(--paper); font-size: 1.1rem; }
  .result { margin-top: 1rem; padding: 1.25rem; border-radius: 14px; text-align: center; display: none; }
  .result.ok { display: block; background: #103A1C; border: 1px solid #2FBF5F; }
  .result.dup { display: block; background: #3A2E10; border: 1px solid var(--accent); }
  .result.bad { display: block; background: #3A1010; border: 1px solid #FF6B6B; }
  .result.pending { display: block; background: rgb(20 33 61 / 0.55); border: 1px solid rgb(66 94 123 / 0.6); color: var(--mute); }
  .result b { font-family: var(--display); font-size: 1.6rem; display: block; }
  .count { color: var(--mute); font-size: 0.9rem; margin-top: 1rem; text-align: center; }

  /* The scan result is the one moment on the door where ambiguity costs money:
     two delegates in a row with the same outcome used to repaint an identical
     panel with no visible change, so staff couldn't tell the second scan from
     a frozen screen. Every result now plays a short flash, re-triggered per
     scan via the Web Animations API. Kept at 160ms — this fires hundreds of
     times a shift and must never feel like a delay. */
  /* An indeterminate bar rather than a pulsing dot: this is read at arm's
     length across a registration desk, where an 8px dot is invisible and a
     full-width sweep is not. */
  .scanbar { position: relative; height: 3px; border-radius: 3px; overflow: hidden;
             background: rgb(66 94 123 / 0.4); margin-top: 0.85rem; }
  .scanbar::after {
    content: ''; position: absolute; inset-block: 0; width: 40%;
    background: var(--accent); border-radius: 3px;
    animation: sweep 1.1s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }
  @keyframes sweep { from { translate: -100% 0; } to { translate: 350% 0; } }
  @media (prefers-reduced-motion: reduce) {
    .scanbar::after { animation: none; width: 100%; opacity: 0.5; }
  }
</style>
</head>
<body>

<h1>SIC 2027 — CHECK-IN</h1>
<div class="fld"><input id="pin" type="password" placeholder="Staff PIN" inputmode="numeric"></div>
<div id="reader"></div>
<div class="result" id="result"></div>
<p class="count" id="count"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function () {
  var result = document.getElementById('result');
  var countEl = document.getElementById('count');
  var scans = 0, busy = false, clearTimer = null;
  var calm = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(cls, title, sub) {
    clearTimeout(clearTimer);
    result.className = 'result ' + cls;
    result.innerHTML = '<b>' + title + '</b>' + (sub || '');
    if (navigator.vibrate) navigator.vibrate(cls === 'ok' ? 80 : [60, 60, 60]);

    // WAAPI rather than a CSS class toggle: .animate() restarts cleanly on
    // every call, so back-to-back identical results still visibly flash.
    // A class toggle would need a forced reflow to re-fire.
    if (result.animate) {
      result.animate(
        calm
          ? [{ opacity: 0.35 }, { opacity: 1 }]
          : [{ opacity: 0.4, transform: 'scale(0.97)' }, { opacity: 1, transform: 'scale(1)' }],
        { duration: 160, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' }
      );
    }

    // Never leave a name on screen under the next person in the queue.
    if (cls !== 'pending') {
      clearTimer = setTimeout(function () { result.className = 'result'; result.innerHTML = ''; }, 6000);
    }
  }

  // Named and exposed so the door flow can be rehearsed without a camera —
  // window.__scan('{"id":"...","sig":"..."}') drives the identical path.
  function handleScan(text) {
    if (busy) return;
    busy = true;
    var pin = document.getElementById('pin').value;
    var payload;
    try { payload = JSON.parse(text); } catch { show('bad', 'NOT A SIC PASS'); busy = false; return; }
    // Venue wi-fi can take seconds. Without this the operator sees nothing
    // between the scan and the answer, and re-presents the same pass.
    show('pending', 'CHECKING…', '<div class="scanbar"></div>');
    fetch('/api/checkin', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: payload.id, sig: payload.sig, pin: pin }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (!x.ok) { show('bad', 'REJECTED', x.d.error || ''); }
        else if (x.d.already) { show('dup', x.d.name, 'ALREADY CHECKED IN · ' + x.d.id); }
        else { scans++; show('ok', x.d.name, x.d.category + ' · ' + x.d.id); }
        countEl.textContent = scans + ' checked in this session';
        setTimeout(function () { busy = false; }, 1200);
      })
      .catch(function () {
        show('bad', 'NETWORK ERROR', 'Pass not recorded — scan again');
        // same cool-down as the success path; releasing instantly let a shaky
        // hand fire several failed scans before the operator could react
        setTimeout(function () { busy = false; }, 1200);
      });
  }

  window.__scan = handleScan;
  var scanner = new Html5QrcodeScanner('reader', { fps: 8, qrbox: 220 }, false);
  scanner.render(handleScan, function () {});
})();
</script>
</body>
</html>
