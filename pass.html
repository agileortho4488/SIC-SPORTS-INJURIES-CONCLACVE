<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Delegate Pass — SIC 2027</title>
<link rel="preload" as="font" type="font/woff2" href="fonts/bebas-neue.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="fonts/instrument-sans.woff2" crossorigin>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23000000'/%3E%3Cpath d='M8 44 56 32' stroke='%23FCA311' stroke-width='6'/%3E%3Ctext x='32' y='28' font-family='Arial Black,sans-serif' font-size='20' font-style='italic' font-weight='900' fill='%23FFFFFF' text-anchor='middle'%3ESIC%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<style>
  body { display: grid; place-items: center; min-height: 100svh; padding: 1.5rem; }
  .pass {
    width: min(100%, 24rem);
    background: linear-gradient(160deg, #14213D, #1B3B59);
    border: 1px solid rgb(252 163 17 / 0.5);
    border-radius: 20px;
    overflow: clip;
    text-align: center;
  }
  .pass-head { background: rgb(0 0 0 / 0.35); padding: 1.25rem; border-bottom: 1px solid rgb(252 163 17 / 0.35); }
  .pass-head .brand-mark, .pass-head .brand-year { font-size: 1.8rem; }
  .pass-head p { font-size: 10px; letter-spacing: 0.2em; color: var(--mute); text-transform: uppercase; margin-top: 0.25rem; }
  .pass-body { padding: 1.5rem; }
  .p-name { font-family: var(--display); font-size: 1.9rem; line-height: 1.1; }
  .p-cat { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin: 0.5rem 0 1.25rem; }
  #qr { display: inline-block; background: #fff; padding: 12px; border-radius: 12px; }
  .p-id { font-family: var(--display); font-size: 1.1rem; color: var(--mute); margin-top: 1rem; letter-spacing: 0.1em; }
  .p-meta { font-size: 11px; color: var(--mute); padding: 1rem; border-top: 1px solid rgb(66 94 123 / 0.4); }
  .p-meta b { color: var(--paper); }
  .actions { margin-top: 1.25rem; display: flex; gap: 0.75rem; justify-content: center; }
  .msg { color: var(--mute); text-align: center; }
  @media print {
    body { background: #fff; }
    .actions, .nav { display: none; }
    .pass { border: 1px solid #14213D; }
  }
</style>
</head>
<body>

<div id="out" class="msg">Loading your pass…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get('id'), sig = q.get('sig');
  var out = document.getElementById('out');
  if (!id || !sig) { out.textContent = 'Invalid pass link.'; return; }
  fetch('/api/delegate?id=' + encodeURIComponent(id) + '&sig=' + encodeURIComponent(sig))
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (x) {
      if (!x.ok) { out.textContent = x.d.error || 'Pass not found.'; return; }
      var d = x.d;
      out.outerHTML =
        '<div class="pass">' +
        '  <div class="pass-head"><span class="brand"><span class="brand-mark">SIC</span><span class="brand-year">2027</span></span>' +
        '    <p>Hyderabad Sports Injuries Conclave · 29th &amp; 30th Jan 2027</p></div>' +
        '  <div class="pass-body">' +
        '    <div class="p-name">' + d.name + '</div>' +
        '    <div class="p-cat">' + d.category + (d.status === 'test' ? ' · DEMO' : '') + '</div>' +
        '    <div id="qr"></div>' +
        '    <div class="p-id">' + d.id + '</div>' +
        '    <div class="actions"><button class="pill" onclick="window.print()">SAVE / PRINT PASS</button></div>' +
        '  </div>' +
        '  <div class="p-meta">Show this QR at the registration desk. <b>Venue: to be announced.</b><br>' + d.cme_line + '</div>' +
        '</div>';
      new QRCode(document.getElementById('qr'), {
        text: JSON.stringify({ id: d.id, sig: sig }),
        width: 168, height: 168, correctLevel: QRCode.CorrectLevel.M,
      });
    })
    .catch(function () { out.textContent = 'Could not load pass — check your connection.'; });
})();
</script>
</body>
</html>
